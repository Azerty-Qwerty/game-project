.ch{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;background:var(--pn);border:1px solid var(--ln);font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--tx)}
.ch i{font-style:normal}.ch small{font-size:10.5px}.pos{color:var(--up)}.neg{color:var(--dn)}
.ch.up{animation:fup .8s}.ch.dn{animation:fdn .8s}

.dt{flex:0 0 auto;margin-left:auto;text-align:right;font:700 13px Georgia,serif;color:var(--ac);padding-left:6px}.dt small{display:block;font:11px system-ui;color:var(--mut)}
#nc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);left:8px;z-index:6;display:none;background:var(--pn);border:1px solid var(--ac);border-radius:14px;padding:10px 12px;max-width:300px;animation:pop .22s ease;backdrop-filter:blur(6px)}#nc small{display:block;color:var(--mut);margin-bottom:6px}

.pc{display:flex;align-items:center;gap:10px}.fl{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:700 11px Georgia,serif;color:#fff;text-shadow:0 1px 2px #000;border:1.5px solid rgba(255,255,255,.5)}
.pt b{display:block;font-size:15px}.pt small{color:var(--mut);font-size:12px}.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tg{padding:3px 8px;border-radius:8px;background:var(--pn2);font-size:12px;border:1px solid var(--ln)}.tg.war{background:#7c2a22;color:#fff;animation:pulse 1.4s infinite}
#ac:empty{display:none}#ac{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:6px 10px;margin-bottom:8px;backdrop-filter:blur(8px);animation:sheet .28s ease}

button{font:inherit;color:var(--tx);background:linear-gradient(var(--bt),var(--pn2));border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .2s,border-color .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
button:hover{border-color:var(--ac);box-shadow:0 0 12px rgba(226,185,75,.35)}button:active{transform:scale(.94)}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
#mn h4.rh{color:var(--ac);font:700 13px Georgia,serif;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 6px}.fc{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}#mn{touch-action:pan-y;-webkit-overflow-scrolling:touch}
